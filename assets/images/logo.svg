<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="minamoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34C6D9" />
      <stop offset="100%" stop-color="#1A5BD8" />
    </linearGradient>
    <linearGradient id="rippleGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34C6D9" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1A5BD8" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="rippleGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34C6D9" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1A5BD8" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="rippleGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34C6D9" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1A5BD8" stop-opacity="0.15" />
    </linearGradient>
  </defs>

  <!-- Logo Mark: Waterdrop & 3 Concentric Ripples -->
  <g transform="translate(6, 6)">
    <!-- Outer Ripple 3 -->
    <circle cx="26" cy="26" r="24" stroke="url(#rippleGrad3)" stroke-width="1.5" stroke-dasharray="3 2" />
    <!-- Middle Ripple 2 -->
    <circle cx="26" cy="26" r="17" stroke="url(#rippleGrad2)" stroke-width="1.8" />
    <!-- Inner Ripple 1 -->
    <circle cx="26" cy="26" r="10.5" stroke="url(#rippleGrad1)" stroke-width="2" />
    <!-- Center Waterdrop -->
    <path d="M26 18 C28.5 21.5 31 24.2 31 27 C31 29.76 28.76 32 26 32 C23.24 32 21 29.76 21 27 C21 24.2 23.5 21.5 26 18 Z" fill="url(#minamoGrad)" />
    <!-- Light Reflection Highlight -->
    <circle cx="24.5" cy="25.5" r="1.2" fill="#FFFFFF" opacity="0.8" />
  </g>

  <!-- Logo Typography -->
  <g transform="translate(70, 0)">
    <!-- English Wordmark -->
    <text x="0" y="34" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="0.08em" fill="#0B1B34">
      MINAMO
    </text>
    <!-- Japanese Corporate Name & Subtitle -->
    <text x="1" y="49" font-family="'Noto Sans JP', sans-serif" font-size="9.5" font-weight="600" letter-spacing="0.22em" fill="#1A5BD8">
      株式会社ミナモ
    </text>
  </g>
</svg>
